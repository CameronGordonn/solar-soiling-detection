name: Docker image

# WHY THIS EXISTS, AND WHY IT IS NOT PART OF ci.yml
#
# From 2026-05-26 to 2026-09-01 the image installed only the `api` extra. It
# built cleanly, started cleanly, and served `solarsoiled --help` cleanly the
# entire time -- then died on `ModuleNotFoundError: rfdetr` the moment anyone ran
# the SHIPPING detector, because rfdetr and sam2 are lazy imports. Nothing in CI
# ever built the image, so three months passed with no signal.
#
# Two deliberate choices:
#
#   1. FULL build, not `EXTRAS=api`. The lean image omits rfdetr and sam2 by
#      design, so it is structurally incapable of catching the one bug that
#      actually happened. A green lean build would be worse than no check: it
#      manufactures confidence. Cost of being right: ~11 GB and ~10 min.
#
#   2. PATH-FILTERED, not every PR. Dockerfile has changed a handful of times in
#      the repo's life. Running this on every PR would burn ~10 min a time to
#      re-prove something that cannot have changed, and would slow the 2m45s
#      test-fast feedback loop it deliberately does not join.
#
# The weekly schedule catches the other failure shape: an upstream release moving
# a dependency floor under us with no commit here at all. That is exactly how the
# sam2 `torch>=2.5.1` floor came to conflict with the pinned torch 2.4.0.

on:
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker-compose.yml'
      - 'pyproject.toml'
      - '.github/workflows/docker.yml'
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker-compose.yml'
      - 'pyproject.toml'
      - '.github/workflows/docker.yml'
  schedule:
    - cron: '17 6 * * 1'      # Mondays 06:17 UTC — upstream drift, no local change
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # The full image is ~10.1 GB unpacked (measured 2026-09-02), and this
      # runner is not comfortably larger than that. CI already failed on
      # 2026-08-30 with `OSError: [Errno 28] No space left on device` over a far
      # smaller CUDA wheel set, so the margin is known to be thin. Reclaiming the
      # preinstalled toolchains nobody here uses buys back tens of GB.
      - name: Free disk space
        run: |
          echo "before:"; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /usr/local/share/boost "${AGENT_TOOLSDIRECTORY:-}" || true
          sudo docker image prune -af || true
          echo "after:"; df -h / | tail -1

      - name: Build image
        run: docker build -t solarsoiled:ci .

      # The check that would have caught the original bug. It imports rfdetr and
      # sam2 explicitly and resolves `production` through the registry, because a
      # green `solarsoiled --help` proves nothing about the detector.
      - name: Smoke test
        run: make docker-smoke DOCKER_TAG=solarsoiled:ci

      - name: Report image size
        if: always()
        run: docker images solarsoiled:ci --format '{{.Repository}}:{{.Tag}} {{.Size}}' || true
